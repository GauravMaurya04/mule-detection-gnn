dataset: HI-Small
seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  reports_dir: reports

split:
  # IBM Multi-GNN's split: whole days, chosen so shares come closest to 60/20/20.
  # Phase 0 result on HI-Small: train Sep 1-6, validation Sep 7-8, test Sep 9-18.
  shares: [0.6, 0.2, 0.2]
  # Normal activity ends on Sep 10; later days are a laundering-heavy generator tail.
  # The no-tail test window stops here.
  no_tail_end: "2022-09-11"

labels:
  # completed: send inside the window, receipt any time before (rule B, the label)
  # within: receipt and send both inside the window (rule A, reported for comparison)
  rule: completed

features:
  lookback_hours: 72       # features see this much history before each window starts
  forward_hours: [24, 72]  # pass-through shares; Phase 0 set X = 72 h
